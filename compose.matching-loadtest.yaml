name: roundy-matching-loadtest

# Dedicated, disposable environment for the AWS HTTP matching test.
# It intentionally excludes frontend, AI, MinIO, OpenVidu and TURN.
services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 3g

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    init: true
    ports:
      - "${BACKEND_BIND_ADDRESS:?BACKEND_BIND_ADDRESS is required}:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JPA_DDL_AUTO: create
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_FRONTEND_URL: http://loadtest.invalid
      CORS_ALLOWED_ORIGINS: http://loadtest.invalid
      WEBSOCKET_ALLOWED_ORIGINS: http://loadtest.invalid
      WEBRTC_TEST_BYPASS_ENABLED: "false"
      SERVER_DOMAIN: http://loadtest.invalid
      KAKAO_CLIENT_ID: loadtest-placeholder
      KAKAO_SECRET_KEY: loadtest-placeholder
      KAKAO_ADMIN_KEY: loadtest-placeholder
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPENVIDU_URL: https://openvidu.invalid
      OPENVIDU_PUBLIC_URL: https://openvidu.invalid
      OPENVIDU_SECRET: loadtest-placeholder
      OPENVIDU_INSECURE_TLS: "false"
      OPENVIDU_CONNECTION_CHECK_ENABLED: "false"
      MINIO_URL: http://minio.invalid:9000
      MINIO_EXTERNAL_URL: http://minio.invalid:9000
      MINIO_ACCESS_KEY: loadtest-placeholder
      MINIO_SECRET_KEY: loadtest-placeholder
      AI_SERVER_URL: http://ai.invalid:8000
      VERIFICATION_AI_SERVER_IPS: 127.0.0.1
      # The load-test node is isolated from real traffic. Keep the higher ingress
      # queue explicit so a connector default does not hide the application limit.
      SERVER_TOMCAT_MAX_CONNECTIONS: ${SERVER_TOMCAT_MAX_CONNECTIONS:-12000}
      SERVER_TOMCAT_ACCEPT_COUNT: ${SERVER_TOMCAT_ACCEPT_COUNT:-2000}
      SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-400}
      LOGGING_LEVEL_COM_SSAFYA701_ROUNDY_SESSION: ${LOAD_TEST_SESSION_LOG_LEVEL:-WARN}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 5g

volumes:
  mysql_data:
