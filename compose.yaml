# Local integration stack only.
# openvidu/openvidu-dev is intentionally used for local development and must not be used in production.
name: roundy

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  openvidu:
    image: openvidu/openvidu-dev:2.32.2
    # OpenVidu v2 dev image has no arm64 manifest; Docker Desktop emulates amd64 on Apple Silicon.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      OPENVIDU_SECRET: ${OPENVIDU_SECRET}
    ports:
      - "127.0.0.1:${OPENVIDU_PORT:-4443}:4443"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 4443), timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ai:
    build:
      context: ./AI
    restart: unless-stopped
    init: true
    environment:
      TF_CPP_MIN_LOG_LEVEL: "2"
    ports:
      - "127.0.0.1:${AI_PORT:-18000}:8000"
    volumes:
      - ai_model_cache:/home/roundy/.deepface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JPA_DDL_AUTO: update
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_FRONTEND_URL: http://localhost:${APP_PORT:-3000}
      CORS_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-3000}
      WEBSOCKET_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-3000}
      SERVER_DOMAIN: http://localhost:${APP_PORT:-3000}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_SECRET_KEY: ${KAKAO_SECRET_KEY}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY}
      JWT_SECRET: ${JWT_SECRET}
      OPENVIDU_URL: http://openvidu:4443
      OPENVIDU_PUBLIC_URL: http://localhost:${OPENVIDU_PORT:-4443}
      OPENVIDU_SECRET: ${OPENVIDU_SECRET}
      OPENVIDU_INSECURE_TLS: "false"
      MINIO_URL: http://minio:9000
      MINIO_EXTERNAL_URL: http://localhost:${MINIO_API_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      AI_SERVER_URL: http://ai:8000
      VERIFICATION_AI_SERVER_IPS: 127.0.0.1
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      openvidu:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./Frontend
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  minio_data:
  ai_model_cache:
