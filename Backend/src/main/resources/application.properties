
spring.application.name=roundy

# .env 파일 경로
spring.config.import=optional:classpath:.env[.properties]

# MYSQL 설정
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA, Hibernate 설정
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Redis 설정
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# 서버 포트 설정
server.port=${SERVER_PORT:8001}
server.address=0.0.0.0

# OpenVidu 설정
openvidu.url=${OPENVIDU_URL:https://openvidu.example.com}
openvidu.secret=${OPENVIDU_SECRET}

# WebRTC WebSocket 설정
webrtc.ws.path=/ws/webrtc
webrtc.round.duration-seconds=${WEBRTC_ROUND_DURATION:300}
webrtc.round.interval-seconds=${WEBRTC_ROUND_INTERVAL:10}