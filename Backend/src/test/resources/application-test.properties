# 테스트용 설정
spring.application.name=roundy-test

# 랜덤 포트 사용
server.port=0

# H2 인메모리 데이터베이스
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 운영용 MySQL seed(data.sql)는 H2 단위/통합 테스트에서 실행하지 않는다.
spring.sql.init.mode=never

# Redis 설정 (테스트용 - 임베디드 Redis 사용 권장)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

# OpenVidu 설정 (Mock 사용)
openvidu.url=http://localhost:8080
openvidu.secret=test-secret

# JWT 설정
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci13ZWJydGMtZGV2ZWxvcG1lbnQtbWluaW11bS0zMi1ieXRlcw==
jwt.expiration-time=172800000

# WebRTC WebSocket 설정
webrtc.ws.path=/ws/webrtc
webrtc.round.duration-seconds=2
webrtc.round.interval-seconds=1

# 로그 레벨
logging.level.com.ssafya701.roundy=DEBUG
logging.level.org.springframework.web.socket=DEBUG
