# 테스트용 설정
spring.application.name=roundy-test

# 서버 포트 (랜덤 포트 사용)
server.port=0

# 테스트용 H2 데이터베이스 설정
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA 설정
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Redis 테스트 설정 (임베디드 Redis 또는 모의 사용)
spring.data.redis.host=localhost
spring.data.redis.port=6370

# OpenVidu 테스트 설정
openvidu.url=http://localhost:8080
openvidu.secret=test-secret

# WebRTC WebSocket 설정
webrtc.ws.path=/ws/webrtc
webrtc.round.duration-seconds=2
webrtc.round.interval-seconds=1

# 로깅 설정
logging.level.com.ssafya701.roundy=DEBUG
logging.level.org.springframework.web.socket=DEBUG
