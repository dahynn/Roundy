apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: roundy-app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
# (API: 8887, Console: 8886)
apiVersion: v1
kind: Service
metadata:
  name: minio-svc
  namespace: roundy-app
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 8887
      targetPort: 8887
    - name: console
      port: 8886
      targetPort: 8886
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: roundy-app
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio
        args:
        - server
        - /data
        - --address
        - ":8887"
        - --console-address
        - ":8886"
        envFrom:
        - secretRef:
            name: minio-secret
        env:
        - name: MINIO_BROWSER_REDIRECT_URL
          value: "https://i14a701.p.ssafy.io/minio-console"
        - name: MINIO_SERVER_URL
          value: "https://i14a701.p.ssafy.io/minio-api"
        ports:
        - containerPort: 8887
        - containerPort: 8886
        volumeMounts:
        - name: storage
          mountPath: /data
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: minio-pvc
