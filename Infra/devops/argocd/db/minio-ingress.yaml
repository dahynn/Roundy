apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roundy-app-minio-ingress
  namespace: roundy-app
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-cert"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: roundy-app-minio-strip-prefix@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  tls:
    - hosts:
      - i14a701.p.ssafy.io
      secretName: tls-cert
  rules:
  - host: i14a701.p.ssafy.io
    http:
      paths:
      - path: /minio
        pathType: Exact
        backend:
          service:
            name: minio-svc
            port:
              number: 8886