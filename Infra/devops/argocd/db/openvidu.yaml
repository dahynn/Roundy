apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvidu-server
  namespace: roundy-app
  labels:
    app: openvidu
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openvidu
  template:
    metadata:
      labels:
        app: openvidu
    spec:
      # hostNetwork: false (default)
      containers:
      - name: openvidu-container
        image: openvidu/openvidu-dev:latest
        ports:
        - containerPort: 443
          name: https
        - containerPort: 3478
          protocol: UDP
          hostPort: 3478 # STUN/TURN용 hostPort 매핑
          name: stun-udp
        - containerPort: 5443
          protocol: TCP
          name: turn-tcp
        # UDP Media Ports (테스트용 40000~40010 범위 매핑)
        - containerPort: 40000
          protocol: UDP
          hostPort: 40000
        - containerPort: 40001
          protocol: UDP
          hostPort: 40001
        - containerPort: 40002
          protocol: UDP
          hostPort: 40002
        - containerPort: 40003
          protocol: UDP
          hostPort: 40003
        - containerPort: 40004
          protocol: UDP
          hostPort: 40004
        - containerPort: 40005
          protocol: UDP
          hostPort: 40005
        - containerPort: 40006
          protocol: UDP
          hostPort: 40006
        - containerPort: 40007
          protocol: UDP
          hostPort: 40007
        - containerPort: 40008
          protocol: UDP
          hostPort: 40008
        - containerPort: 40009
          protocol: UDP
          hostPort: 40009
        - containerPort: 40010
          protocol: UDP
          hostPort: 40010
        envFrom:
        - secretRef:
            name: openvidu-secret
        env:
        - name: OPENVIDU_PORT
          value: "443"
        - name: SERVER_PORT
          value: "443"
        - name: HTTPS_PORT
          value: "443"
        - name: HTTP_PORT
          value: "80"
        - name: MIN_PORT
          value: "16384"
        - name: MAX_PORT
          value: "32768"
        - name: KMS_MIN_PORT
          value: "40000"
        - name: KMS_MAX_PORT
          value: "40010"
        - name: DOMAIN_OR_PUBLIC_IP
          value: "i14a701.p.ssafy.io"
        - name: CERTIFICATE_TYPE
          value: "selfsigned"
        - name: TURN_PORT_TCP
          value: "5443"
        - name: TURN_PORT_UDP
          value: "3478"
---
apiVersion: v1
kind: Service
metadata:
  name: openvidu-service
  namespace: roundy-app
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: http # 내부 443은 HTTP (SSL Offload)
spec:
  selector:
    app: openvidu
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
    - name: stun-udp
      protocol: UDP
      port: 3478
      targetPort: 3478
    - name: turn-tcp
      protocol: TCP
      port: 5443
      targetPort: 5443
  type: ClusterIP
