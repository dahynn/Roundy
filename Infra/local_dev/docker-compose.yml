version: '3.1'

services:
  # -----------------------------------------------------------
  # 1. OpenVidu Server (WebRTC Engine)
  # -----------------------------------------------------------
  openvidu-server-kms:
    image: openvidu/openvidu-dev:2.30.0
    container_name: openvidu-server-kms
    restart: always
    # network_mode: host # [FIX] host 모드 제거하여 ports 설정이 적용되도록 수정
    # host 모드 사용 시 ports 섹션이 무시되므로, 명시적 포트 매핑을 위해 bridge 모드(기본값) 사용
    ports:
      - "4443:4443"
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    environment:
      - OPENVIDU_SECRET=${OPENVIDU_SECRET}
      - OPENVIDU_PUBLICURL=https://${DOMAIN_OR_PUBLIC_IP}:4443/
      - DOMAIN_OR_PUBLIC_IP=${DOMAIN_OR_PUBLIC_IP}
      - CERTIFICATE_TYPE=selfsigned
      - OPENVIDU_RECORDING=false
      - OPENVIDU_WEBHOOK=false
      - KMS_MIN_PORT=40000
      - KMS_MAX_PORT=40100 # 포트 범위 축소 (테스트용)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - openvidu_recordings:/opt/openvidu/recordings

  # -----------------------------------------------------------
  # 2. MinIO (S3 Compatible Storage)
  # -----------------------------------------------------------
  minio:
    image: minio/minio
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001" 
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # -----------------------------------------------------------
  # 3. Redis (Cache & Session Store)
  # -----------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # -----------------------------------------------------------
  # 4. MySQL (Main Database)
  # -----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  openvidu_recordings:
  minio_data:
  redis_data:
  mysql_data:
